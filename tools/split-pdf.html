<!doctype html>
<html lang="en">
<head><!--@toolhead:split-pdf--></head>
<body>
<!--@toolstart:split-pdf-->
<div class="panel stack">
  <!--@drop:drop|Drop a PDF, or click to choose|Pick the pages you want in the next step.-->
  <div id="opts" hidden class="stack">
    <p class="hint" id="info"></p>
    <div class="grid-2">
      <div class="field"><label for="ranges">Pages to keep</label><input type="text" id="ranges" placeholder="e.g. 1-3, 5, 8-"><span class="hint">Use commas and dashes. “8-” means page 8 to the end.</span></div>
      <div class="field"><label for="mode">Output</label><select id="mode"><option value="one">One PDF with those pages</option><option value="each">A separate PDF per page (ZIP)</option></select></div>
    </div>
    <div class="row-wrap">
      <button class="btn" id="go" type="button">Split PDF</button>
      <button class="btn-ghost" id="again" type="button">Choose another file</button>
    </div>
    <p class="error" id="err"></p>
  </div>
</div>
<!--@toolend:split-pdf-->
</body>
</html>
