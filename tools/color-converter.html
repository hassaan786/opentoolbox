<!doctype html>
<html lang="en">
<head><!--@toolhead:color-converter--></head>
<body>
<!--@toolstart:color-converter-->
<div class="grid-2">
  <div class="panel stack">
    <div class="row-wrap"><input type="color" id="picker" value="#c8f547" aria-label="Pick a color"><div class="field" style="flex:1"><label for="any">Any color value</label><input type="text" id="any" value="#C8F547" spellcheck="false" placeholder="#hex, rgb(), hsl()"></div></div>
    <div id="swatch" style="height:140px;border-radius:14px;border:1px solid var(--border)"></div>
    <p class="error" id="err"></p>
  </div>
  <div class="panel"><table class="data"><tbody id="rows"></tbody></table><p class="hint" id="contrast" style="margin-top:12px"></p></div>
</div>
<!--@toolend:color-converter-->
</body>
</html>
