<!doctype html>
<html lang="en">
<head><!--@toolhead:jwt-decoder--></head>
<body>
<!--@toolstart:jwt-decoder-->
<div class="panel stack">
  <div class="field"><label for="input">Token</label><textarea id="input" rows="5" spellcheck="false" placeholder="eyJhbGciOi…"></textarea></div>
  <p class="error" id="err"></p>
  <div id="status" class="note" hidden style="margin:0"></div>
</div>
<div class="grid-2" style="margin-top:16px">
  <div class="panel stack"><div class="panel-title">Header</div><pre class="output" id="header"></pre></div>
  <div class="panel stack"><div class="panel-title">Payload</div><pre class="output" id="payload"></pre><div id="claims" class="hint"></div></div>
</div>
<div class="note warn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><p>This only decodes the token. It does not check the signature, so never trust a token just because it decodes. Treat production tokens like passwords.</p></div>
<!--@toolend:jwt-decoder-->
</body>
</html>
