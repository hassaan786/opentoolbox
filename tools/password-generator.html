<!doctype html>
<html lang="en">
<head><!--@toolhead:password-generator--></head>
<body>
<!--@toolstart:password-generator-->
<div class="panel stack">
  <div class="row-wrap" style="flex-wrap:nowrap">
    <pre class="output" id="out" style="flex:1;font-size:20px;margin:0;min-height:0" aria-live="polite"></pre>
    <button class="btn" id="copy" type="button">Copy</button>
    <button class="btn-ghost" id="regen" type="button" aria-label="Generate new password">↻</button>
  </div>
  <div class="bar"><i id="meter"></i></div>
  <p class="hint" id="strength"></p>
</div>
<div class="panel stack">
  <div class="field"><label for="len">Length: <span id="len-val">20</span></label><input type="range" id="len" min="8" max="64" value="20"></div>
  <div class="row-wrap">
    <label class="check"><input type="checkbox" id="upper" checked> A–Z</label>
    <label class="check"><input type="checkbox" id="lower" checked> a–z</label>
    <label class="check"><input type="checkbox" id="digits" checked> 0–9</label>
    <label class="check"><input type="checkbox" id="symbols" checked> !@#$</label>
    <label class="check"><input type="checkbox" id="ambig"> Avoid look-alikes (l 1 I O 0)</label>
  </div>
  <div class="field"><span class="label">Or a passphrase</span><div class="row-wrap"><button class="btn-ghost btn-sm" id="phrase" type="button">Generate 5-word passphrase</button></div></div>
</div>
<!--@toolend:password-generator-->
</body>
</html>
